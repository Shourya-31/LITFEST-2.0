<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ttbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <radialGradient id="ttglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1035" stop-opacity="0" />
    </radialGradient>
    <filter id="ttblur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#ttbg)" />
  <circle cx="400" cy="220" r="185" fill="url(#ttglow)" filter="url(#ttblur)" />

  <!-- Submarine Monitor / Screen Frame -->
  <g transform="translate(400, 215)">
    <!-- Retro Cyber Screen -->
    <rect x="-110" y="-80" width="220" height="150" rx="20" fill="#0f0728" stroke="#a855f7" stroke-width="3" />
    <rect x="-95" y="-65" width="190" height="120" rx="12" fill="#2e1065" stroke="#c084fc" stroke-width="1.5" />
    
    <!-- TV Antenna / Periscope -->
    <path d="M-30,-80 L-65,-125 M30,-80 L65,-125" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <circle cx="-65" cy="-125" r="5" fill="#f472b6" />
    <circle cx="65" cy="-125" r="5" fill="#f472b6" />
    
    <!-- Playful Troll Smile / Wave -->
    <path d="M-60,-20 Q-30,-45 0,-20 Q30,-45 60,-20" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" />
    <path d="M-50,15 Q0,50 50,15" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <!-- Glowing digital pixel eyes -->
    <rect x="-45" y="-12" width="14" height="14" rx="3" fill="#38bdf8" />
    <rect x="31" y="-12" width="14" height="14" rx="3" fill="#38bdf8" />
  </g>
  <text x="400" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#faf5ff" text-anchor="middle" letter-spacing="3">TUBE TROLLS</text>
  <text x="400" y="450" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#c084fc" text-anchor="middle" letter-spacing="4">MEDIA ROAST & DIGITAL WIT</text>
</svg>
