<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="jgbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="jgglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="jgblur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#jgbg)" />
  <circle cx="400" cy="220" r="185" fill="url(#jgglow)" filter="url(#jgblur)" />

  <!-- Glowing Jenga Tower Blocks in Ocean Depths -->
  <g transform="translate(400, 215)">
    <!-- Base Layer -->
    <rect x="-60" y="55" width="120" height="22" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <!-- Layer 2 -->
    <rect x="-55" y="30" width="36" height="22" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" />
    <rect x="-16" y="30" width="36" height="22" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" />
    <rect x="23" y="30" width="36" height="22" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" />
    <!-- Layer 3 -->
    <rect x="-60" y="5" width="120" height="22" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <!-- Layer 4 (offset / sliding block) -->
    <rect x="-55" y="-20" width="36" height="22" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" />
    <rect x="23" y="-20" width="36" height="22" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" />
    <!-- Sliding pulled block -->
    <rect x="55" y="-25" width="45" height="22" rx="3" fill="#38bdf8" stroke="#f0f9ff" stroke-width="2" transform="rotate(-6 70 -15)" />
    <!-- Layer 5 -->
    <rect x="-60" y="-45" width="120" height="22" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <!-- Top Layer (precarious) -->
    <rect x="-35" y="-70" width="36" height="22" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" transform="rotate(3 -17 -59)" />
    <rect x="5" y="-70" width="36" height="22" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5" transform="rotate(3 23 -59)" />
  </g>
  <text x="400" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="3">JENGA</text>
  <text x="400" y="450" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#38bdf8" text-anchor="middle" letter-spacing="4">TOWER TENSION UNDERWATER</text>
</svg>
