<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - LITFEST 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="p1.css">

  <style>
    :root {
      --c1: #010814;
      --c2: #02233c;
      --c3: #003f66;
      --c4: #010d1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      color: #fff;
      overflow-x: hidden;
      position: relative;
      background: #010814;
    }

    #warp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    #contactForm {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 38px 34px 34px;
      background: linear-gradient(165deg, rgba(2, 28, 58, 0.92) 0%, rgba(1, 15, 34, 0.97) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.38);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 10, 26, 0.75), inset 0 1px 1px rgba(125, 211, 252, 0.25);
      position: relative;
      z-index: 10;
    }

    .contact-header-wrap {
      text-align: center;
      margin-bottom: 6px;
    }

    #contactForm h2 {
      margin: 0 0 6px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(30px, 5.5vw, 38px);
      font-weight: 700;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #ffffff 20%, #93c5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .contact-subtitle {
      margin: 0 auto;
      font-size: 13.5px;
      line-height: 1.5;
      color: #94a3b8;
    }

    #contactForm label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #cbd5e1;
      margin-top: 4px;
    }

    #contactForm input,
    #contactForm textarea {
      padding: 12px 16px;
      background: rgba(1, 18, 40, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    #contactForm input::placeholder,
    #contactForm textarea::placeholder {
      color: rgba(148, 163, 184, 0.55);
    }

    #contactForm input:focus,
    #contactForm textarea:focus {
      border-color: #38bdf8;
      background: rgba(2, 28, 60, 0.9);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35), inset 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    #contactForm button[type="submit"] {
      margin-top: 14px;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.35);
      transition: all 0.25s ease;
    }

    #contactForm button[type="submit"]:hover {
      background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.55);
    }

    .back-home-wrap {
      margin-top: 20px;
      z-index: 10;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 999px;
      background: rgba(2, 24, 52, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    .back-home-link:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(56, 189, 248, 0.25);
    }
  </style>
</head>

<body>
  <canvas id="warp" aria-hidden="true"></canvas>

  <form id="contactForm">
    <div class="contact-header-wrap">
      <h2>Contact Us</h2>
      <p class="contact-subtitle">Get in touch with the Literati organizing committee.</p>
    </div>

    <label for="username">Your Name</label>
    <input type="text" id="username" name="name" placeholder="Your Name" pattern="[^0-9]*"
      title="Numbers are not allowed in your name." required>

    <label for="PhoneNo">Your Contact No</label>
    <input type="tel" id="PhoneNo" name="PhoneNo" placeholder="XXXXXXXXXX" inputmode="numeric" pattern="[0-9]{10}"
      maxlength="10" title="Enter a 10-digit phone number (digits only)." required>

    <label for="userEmail">Your Email</label>
    <input type="email" id="userEmail" name="email" placeholder="you@example.com" required>

    <label for="userFeedback">Your Feedback</label>
    <textarea id="userFeedback" name="feedback" rows="5" minlength="20" placeholder="Write your message or inquiry here..."
      required></textarea>

    <button type="submit">Send Message</button>
  </form>

  <div class="back-home-wrap">
    <a href="/" class="back-home-link" title="Return to Litfest 2.0 Surface">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
      </svg>
      <span>Return to Surface</span>
    </a>
  </div>

  <script>
    const TO_EMAIL = "literati@nitrr.ac.in";

    const usernameInput = document.getElementById("username");
    const phoneInput = document.getElementById("PhoneNo");

    usernameInput.addEventListener("input", function () {
      this.value = this.value.replace(/[0-9]/g, "");
    });

    phoneInput.addEventListener("input", function () {
      this.value = this.value.replace(/[^0-9+]/g, "");
      if (this.value.includes("+")) {
        this.value = "+" + this.value.replace(/\+/g, "").replace(/\D/g, "");
      }
    });

    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const userEmail = document.getElementById("userEmail").value.trim();
      const username = document.getElementById("username").value.trim();
      const PhoneNo = document.getElementById("PhoneNo").value.trim();
      const feedback = document.getElementById("userFeedback").value.trim();

      const subject = "Website Feedback";
      const body =
        "Name: " + username + "\n\n" +
        "From: " + userEmail + "\n\n" +
        "Contact No: " + PhoneNo + "\n\n" +
        "Feedback:\n" + feedback;

      const mailtoLink =
        "mailto:" + TO_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

      window.location.href = mailtoLink;
    });
  </script>
  <script>
    (function () {
      var S = {
        proportion: 0.45, softness: 1, distortion: 0.25, swirl: 0.8,
        swirlIterations: 10, shapeScale: 0.1, scale: 1, rotation: 0, speed: 1,
        colors: ["hsl(215,85%,8%)", "hsl(200,90%,18%)", "hsl(195,80%,28%)", "hsl(220,95%,6%)"]
      };

      var canvas = document.getElementById("warp");
      var gl = canvas.getContext("webgl", { antialias: false, alpha: false });
      if (!gl) return;

      function hsl(str) {
        var m = str.match(/[\d.]+/g).map(Number);
        var h = m[0] / 360, s = m[1] / 100, l = m[2] / 100;
        function f(n) {
          var k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
          return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
        }
        return [f(0), f(8), f(4)];
      }
      var cols = S.colors.map(hsl);

      var vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
      var fs = [
        "precision highp float;",
        "uniform vec2 uRes;uniform float uTime;uniform vec3 uC[4];",
        "const float PROP=" + S.proportion.toFixed(3) + ";",
        "const float SOFT=" + S.softness.toFixed(3) + ";",
        "const float DIST=" + S.distortion.toFixed(3) + ";",
        "const float SWIRL=" + S.swirl.toFixed(3) + ";",
        "const float SSCALE=" + S.shapeScale.toFixed(3) + ";",
        "const float ROT=" + (S.rotation * Math.PI / 180).toFixed(4) + ";",
        "void main(){",
        "  vec2 uv=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);",
        "  uv/=" + S.scale.toFixed(3) + ";",
        "  float c=cos(ROT),s=sin(ROT);uv=mat2(c,-s,s,c)*uv;",
        "  uv*=SSCALE*40.;",
        "  float t=uTime;",
        "  for(int i=1;i<" + S.swirlIterations + ";i++){",
        "    float fi=float(i);",
        "    uv.x+=(SWIRL+DIST)/fi*cos(t+fi*1.5*uv.y);",
        "    uv.y+=(SWIRL+DIST)/fi*cos(t+fi*1.0*uv.x);",
        "  }",
        "  float shape=.5+.5*sin(uv.x)*cos(uv.y);",
        "  shape=smoothstep(PROP-SOFT*.5-.001,PROP+SOFT*.5+.5,shape);",
        "  float x=clamp(shape,0.,1.)*3.;",
        "  vec3 col=mix(uC[0],uC[1],smoothstep(0.,1.,x));",
        "  col=mix(col,uC[2],smoothstep(1.,2.,x));",
        "  col=mix(col,uC[3],smoothstep(2.,3.,x));",
        "  gl_FragColor=vec4(col,1.);",
        "}"
      ].join("\n");

      function sh(type, src) {
        var o = gl.createShader(type);
        gl.shaderSource(o, src); gl.compileShader(o);
        if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(o)); }
        return o;
      }
      var prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog); gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      var uRes = gl.getUniformLocation(prog, "uRes");
      var uTime = gl.getUniformLocation(prog, "uTime");
      gl.uniform3fv(gl.getUniformLocation(prog, "uC"), new Float32Array(cols.flat()));

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);
      }
      addEventListener("resize", resize); resize();

      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var start = performance.now();
      function frame(now) {
        gl.uniform1f(uTime, reduce ? 0 : (now - start) / 1000 * 0.25 * S.speed);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        if (!reduce) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>

</html>
