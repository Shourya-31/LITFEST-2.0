<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="p1.css">

  <style>
    :root {
      --c1: hsl(200, 100%, 20%);
      --c2: hsl(160, 100%, 75%);
      --c3: hsl(180, 90%, 30%);
      --c4: hsl(170, 100%, 80%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: sans-serif;
      color: #fff;
      overflow-x: hidden;
      position: relative;
      background: var(--c1);
    }

    #warp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: -1;
    }


    #contactForm {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    #contactForm h2 {
      margin: 0 0 8px;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 300;
      text-align: center;
    }

    #contactForm label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    #contactForm input,
    #contactForm textarea {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    #contactForm input::placeholder,
    #contactForm textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    #contactForm input:focus,
    #contactForm textarea:focus {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.22);
    }

    #contactForm button {
      margin-top: 10px;
      padding: 14px;
      background: #fff;
      color: #1f2937;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.3s;
    }

    #contactForm button:hover {
      transform: scale(1.04);
    }
  </style>
</head>

<body>
   <canvas id="warp" aria-hidden="true"></canvas>

  <form id="contactForm">
    <h2>Contact Us</h2>

    <label for="username">Your Name</label>
    <input type="text" id="username" name="name" placeholder="Your Name" pattern="[^0-9]*"
      title="Numbers are not allowed in your name." required>

    
    <label for="PhoneNo">Your Contact No</label>
<input type="tel" id="PhoneNo" name="PhoneNo" placeholder="XXXXXXXXXX"
  inputmode="numeric" pattern="[0-9]{10}" maxlength="10"
  title="Enter a 10-digit phone number (digits only)." required>

    <label for="userEmail">Your Email</label>
    <input type="email" id="userEmail" name="email" placeholder="you@example.com" required>

    <label for="userFeedback">Your Feedback</label>
    <textarea id="userFeedback" name="feedback" rows="6" minlength="20"
      placeholder="Write your feedback here..." required></textarea>

    <button type="submit">Submit</button>
  </form>

  <script>
    const TO_EMAIL = "vanshchauhan4578@gmail.com";

    const usernameInput = document.getElementById("username");
    const phoneInput = document.getElementById("PhoneNo");

    usernameInput.addEventListener("input", function () {
      this.value = this.value.replace(/[0-9]/g, "");
    });

    phoneInput.addEventListener("input", function () {
      this.value = this.value.replace(/[^0-9+]/g, "");
      if (this.value.includes("+")) {
        this.value = "+" + this.value.replace(/\+/g, "").replace(/\D/g, "");
      }
    });

    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const userEmail = document.getElementById("userEmail").value.trim();
      const username = document.getElementById("username").value.trim();
      const PhoneNo = document.getElementById("PhoneNo").value.trim();
      const feedback = document.getElementById("userFeedback").value.trim();

      const subject = "Website Feedback";
      const body =
        "Name: " + username + "\n\n" +
        "From: " + userEmail + "\n\n" +
        "Contact No: " + PhoneNo + "\n\n" +
        "Feedback:\n" + feedback;

      const mailtoLink =
        "mailto:" + TO_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

      window.location.href = mailtoLink;
    });
  </script>
  <script>
  (function () {
    var S = {
      proportion: 0.45, softness: 1, distortion: 0.25, swirl: 0.8,
      swirlIterations: 10, shapeScale: 0.1, scale: 1, rotation: 0, speed: 1,
      colors: ["hsl(200,100%,20%)", "hsl(160,100%,75%)", "hsl(180,90%,30%)", "hsl(170,100%,80%)"]
    };
 
    var canvas = document.getElementById("warp");
    var gl = canvas.getContext("webgl", { antialias: false, alpha: false });
    if (!gl) return;
 
    function hsl(str) {
      var m = str.match(/[\d.]+/g).map(Number);
      var h = m[0] / 360, s = m[1] / 100, l = m[2] / 100;
      function f(n) {
        var k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
        return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
      }
      return [f(0), f(8), f(4)];
    }
    var cols = S.colors.map(hsl);
 
    var vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
    var fs = [
      "precision highp float;",
      "uniform vec2 uRes;uniform float uTime;uniform vec3 uC[4];",
      "const float PROP=" + S.proportion.toFixed(3) + ";",
      "const float SOFT=" + S.softness.toFixed(3) + ";",
      "const float DIST=" + S.distortion.toFixed(3) + ";",
      "const float SWIRL=" + S.swirl.toFixed(3) + ";",
      "const float SSCALE=" + S.shapeScale.toFixed(3) + ";",
      "const float ROT=" + (S.rotation * Math.PI / 180).toFixed(4) + ";",
      "void main(){",
      "  vec2 uv=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);",
      "  uv/=" + S.scale.toFixed(3) + ";",
      "  float c=cos(ROT),s=sin(ROT);uv=mat2(c,-s,s,c)*uv;",
      "  uv*=SSCALE*40.;",
      "  float t=uTime;",
      "  for(int i=1;i<" + S.swirlIterations + ";i++){",
      "    float fi=float(i);",
      "    uv.x+=(SWIRL+DIST)/fi*cos(t+fi*1.5*uv.y);",
      "    uv.y+=(SWIRL+DIST)/fi*cos(t+fi*1.0*uv.x);",
      "  }",
      "  float shape=.5+.5*sin(uv.x)*cos(uv.y);",
      "  shape=smoothstep(PROP-SOFT*.5-.001,PROP+SOFT*.5+.5,shape);",
      "  float x=clamp(shape,0.,1.)*3.;",
      "  vec3 col=mix(uC[0],uC[1],smoothstep(0.,1.,x));",
      "  col=mix(col,uC[2],smoothstep(1.,2.,x));",
      "  col=mix(col,uC[3],smoothstep(2.,3.,x));",
      "  gl_FragColor=vec4(col,1.);",
      "}"
    ].join("\n");
 
    function sh(type, src) {
      var o = gl.createShader(type);
      gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(o)); }
      return o;
    }
    var prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog); gl.useProgram(prog);
 
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
 
    var uRes = gl.getUniformLocation(prog, "uRes");
    var uTime = gl.getUniformLocation(prog, "uTime");
    gl.uniform3fv(gl.getUniformLocation(prog, "uC"), new Float32Array(cols.flat()));
 
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    }
    addEventListener("resize", resize); resize();
 
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var start = performance.now();
    function frame(now) {
      gl.uniform1f(uTime, reduce ? 0 : (now - start) / 1000 * 0.25 * S.speed);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>

</html>
