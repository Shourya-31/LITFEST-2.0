<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="p1.css">

  <style>
    :root {
      --c1: hsl(200, 100%, 20%);
      --c2: hsl(160, 100%, 75%);
      --c3: hsl(180, 90%, 30%);
      --c4: hsl(170, 100%, 80%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: sans-serif;
      color: #fff;
      overflow-x: hidden;
      position: relative;
      background: var(--c1);
    }

    /* Animated background layer */
    body::before {
      content: "";
      position: fixed;
      inset: -30%;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 30%, var(--c2) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, var(--c4) 0%, transparent 35%),
        radial-gradient(circle at 70% 80%, var(--c3) 0%, transparent 45%),
        radial-gradient(circle at 25% 85%, var(--c2) 0%, transparent 40%),
        var(--c1);
      filter: blur(40px) saturate(120%);
      animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(8deg) scale(1.15); }
      100% { transform: rotate(-6deg) scale(1.05); }
    }

    #contactForm {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    #contactForm h2 {
      margin: 0 0 8px;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 300;
      text-align: center;
    }

    #contactForm label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    #contactForm input,
    #contactForm textarea {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    #contactForm input::placeholder,
    #contactForm textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    #contactForm input:focus,
    #contactForm textarea:focus {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.22);
    }

    #contactForm button {
      margin-top: 10px;
      padding: 14px;
      background: #fff;
      color: #1f2937;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.3s;
    }

    #contactForm button:hover {
      transform: scale(1.04);
    }
  </style>
</head>

<body>

  <form id="contactForm">
    <h2>Contact Us</h2>

    <label for="username">Your Name</label>
    <input type="text" id="username" name="name" placeholder="Your Name" required pattern="[A-Za-z ]+" title="Only letters and spaces are allowed">

    <label for="PhoneNo">Your Contact No</label>
    <input type="tel" id="PhoneNo" name="PhoneNo" placeholder="+91XXXXXXX" required inputmode="numeric" pattern="[0-9+]+" title="Only numbers and + are allowed">

    <label for="userEmail">Your Email</label>
    <input type="email" id="userEmail" name="email" placeholder="you@example.com" required>

    <label for="userFeedback">Your Feedback</label>
    <textarea id="userFeedback" name="feedback" rows="6" minlength="20"
      placeholder="Write your feedback here..." required></textarea>

    <button type="submit">Submit</button>
  </form>

  <script>
    const TO_EMAIL = "vanshchauhan4578@gmail.com";

    const usernameInput = document.getElementById("username");
    const phoneInput = document.getElementById("PhoneNo");

    usernameInput.addEventListener("input", function () {
      this.value = this.value.replace(/[0-9]/g, "");
    });

    phoneInput.addEventListener("input", function () {
      this.value = this.value.replace(/[^0-9+]/g, "");
      if (this.value.includes("+")) {
        this.value = "+" + this.value.replace(/\+/g, "").replace(/\D/g, "");
      }
    });

    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const userEmail = document.getElementById("userEmail").value.trim();
      const username = document.getElementById("username").value.trim();
      const PhoneNo = document.getElementById("PhoneNo").value.trim();
      const feedback = document.getElementById("userFeedback").value.trim();

      const subject = "Website Feedback";
      const body =
        "Name: " + username + "\n\n" +
        "From: " + userEmail + "\n\n" +
        "Contact No: " + PhoneNo + "\n\n" +
        "Feedback:\n" + feedback;

      const mailtoLink =
        "mailto:" + TO_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

      window.location.href = mailtoLink;
    });
  </script>
</body>

</html>
