<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sponsor page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Poppins:wght@400;500;600&amp;display=swap">

<style>
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;background:#003f66;overflow-x:hidden}

    /* ---- Shader background ---- */
    #warp{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

    /* ---- Page layout (unchanged positions) ---- */
    .page{position:relative;z-index:1;width:100%;max-width:1200px;min-height:624px;margin:0 auto}
    .page>*{position:absolute;margin:0;overflow:hidden}
    .page>.heading{overflow:visible}
    .heading{display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;text-shadow:0 2px 24px rgba(0,40,60,.35)}
    h1.heading{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,64px);line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
    h2.heading{font-family:'Poppins',system-ui,sans-serif;font-weight:500;font-size:clamp(16px,2.4vw,28px);line-height:1.2;letter-spacing:.14em;text-transform:uppercase}
    .image{
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.35);
      border-radius:16px;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      transition:transform .3s ease,background .3s ease;
    }
    .image:hover{transform:scale(1.03);background:rgba(255,255,255,.28)}
    img.image{display:block;object-fit:cover}
</style>
</head>
<body>

<canvas id="warp" aria-hidden="true"></canvas>

<div class="page">
  <h1 class="heading" style="left:0;top:56px;width:100%;height:96px;z-index:1">Our Sponsors</h1>
  <div class="image" role="img" aria-label="Image" style="left:5.333%;top:232px;width:30%;height:240px;z-index:2"></div>
  <div class="image" role="img" aria-label="Image" style="left:50.667%;top:232px;width:30%;height:240px;z-index:3"></div>
  <h2 class="heading" style="left:5.333%;top:484px;width:30%;height:72px;z-index:4">NIT RAIPUR</h2>
  <h2 class="heading" style="left:50.667%;top:484px;width:30%;height:72px;z-index:5">SBI BANK</h2>
</div>

<script>
(function () {
  
  var S = {
    proportion: 0.45, softness: 1, distortion: 0.25, swirl: 0.8,
    swirlIterations: 10, shapeScale: 0.1, scale: 1, rotation: 0, speed: 1,
    colors: ["hsl(200,100%,20%)", "hsl(160,100%,75%)", "hsl(180,90%,30%)", "hsl(170,100%,80%)"]
  };

  var canvas = document.getElementById("warp");
  var gl = canvas.getContext("webgl", { antialias: false, alpha: false });
  if (!gl) return; // falls back to body background colour

  function hsl(str) {
    var m = str.match(/[\d.]+/g).map(Number);
    var h = m[0] / 360, s = m[1] / 100, l = m[2] / 100;
    function f(n) {
      var k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
      return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    }
    return [f(0), f(8), f(4)];
  }
  var cols = S.colors.map(hsl);

  var vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var fs = [
    "precision highp float;",
    "uniform vec2 uRes;uniform float uTime;uniform vec3 uC[4];",
    "const float PROP=" + S.proportion.toFixed(3) + ";",
    "const float SOFT=" + S.softness.toFixed(3) + ";",
    "const float DIST=" + S.distortion.toFixed(3) + ";",
    "const float SWIRL=" + S.swirl.toFixed(3) + ";",
    "const float SSCALE=" + S.shapeScale.toFixed(3) + ";",
    "const float ROT=" + (S.rotation * Math.PI / 180).toFixed(4) + ";",
    "void main(){",
    "  vec2 uv=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);",
    "  uv/=" + S.scale.toFixed(3) + ";",
    "  float c=cos(ROT),s=sin(ROT);uv=mat2(c,-s,s,c)*uv;",
    "  uv*=SSCALE*40.;",                       // checks density
    "  float t=uTime;",
    "  for(int i=1;i<" + S.swirlIterations + ";i++){",
    "    float fi=float(i);",
    "    uv.x+=(SWIRL+DIST)/fi*cos(t+fi*1.5*uv.y);",
    "    uv.y+=(SWIRL+DIST)/fi*cos(t+fi*1.0*uv.x);",
    "  }",
    "  float shape=.5+.5*sin(uv.x)*cos(uv.y);",   // checks pattern
    "  shape=smoothstep(PROP-SOFT*.5-.001,PROP+SOFT*.5+.5,shape);",
    "  float x=clamp(shape,0.,1.)*3.;",
    "  vec3 col=mix(uC[0],uC[1],smoothstep(0.,1.,x));",
    "  col=mix(col,uC[2],smoothstep(1.,2.,x));",
    "  col=mix(col,uC[3],smoothstep(2.,3.,x));",
    "  gl_FragColor=vec4(col,1.);",
    "}"
  ].join("\n");

  function sh(type, src) {
    var o = gl.createShader(type);
    gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(o)); }
    return o;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, "uRes");
  var uTime = gl.getUniformLocation(prog, "uTime");
  gl.uniform3fv(gl.getUniformLocation(prog, "uC"), new Float32Array(cols.flat()));

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5); // cap for performance
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  addEventListener("resize", resize); resize();

  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var start = performance.now();
  function frame(now) {
    gl.uniform1f(uTime, reduce ? 0 : (now - start) / 1000 * 0.25 * S.speed);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
