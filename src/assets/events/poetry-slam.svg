<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="psbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="psglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <filter id="psblur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#psbg)" />
  <circle cx="400" cy="220" r="185" fill="url(#psglow)" filter="url(#psblur)" />

  <!-- Luminous Bioluminescent Microphone & Acoustic Ripple Waves -->
  <g transform="translate(400, 215)">
    <!-- Acoustic Sound Waves -->
    <circle cx="0" cy="-30" r="85" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
    <circle cx="0" cy="-30" r="115" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4" />
    
    <!-- Vintage Stage Mic Capsule -->
    <rect x="-24" y="-80" width="48" height="70" rx="24" fill="#4338ca" stroke="#f472b6" stroke-width="3" />
    <line x1="-24" y1="-55" x2="24" y2="-55" stroke="#fbcfe8" stroke-width="2" />
    <line x1="-24" y1="-35" x2="24" y2="-35" stroke="#fbcfe8" stroke-width="2" />
    <line x1="0" y1="-80" x2="0" y2="-10" stroke="#fbcfe8" stroke-width="2" />
    
    <!-- Mic Stand & Base -->
    <path d="M-36,-45 C-36,-5 36,-5 36,-45" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-5" x2="0" y2="70" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="0" cy="72" rx="45" ry="12" fill="#312e81" stroke="#f472b6" stroke-width="2" />
  </g>
  <text x="400" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#fdf2f8" text-anchor="middle" letter-spacing="3">POETRY SLAM</text>
  <text x="400" y="450" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#f472b6" text-anchor="middle" letter-spacing="4">SPOKEN VERSE & LYRIC PASSION</text>
</svg>
