<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="slbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142b1f" />
      <stop offset="50%" stop-color="#164e63" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="slglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#142b1f" stop-opacity="0" />
    </radialGradient>
    <filter id="slblur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#slbg)" />
  <circle cx="400" cy="220" r="185" fill="url(#slglow)" filter="url(#slblur)" />

  <!-- Oceanic Snakes & Sunken Ladders Board -->
  <g transform="translate(400, 215)">
    <!-- Board grid outline -->
    <rect x="-95" y="-85" width="190" height="155" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#2dd4bf" stroke-width="2" />
    <!-- Grid lines -->
    <line x1="-35" y1="-85" x2="-35" y2="70" stroke="#047857" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="25" y1="-85" x2="25" y2="70" stroke="#047857" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="-95" y1="-30" x2="95" y2="-30" stroke="#047857" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="-95" y1="20" x2="95" y2="20" stroke="#047857" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Coral Ladder -->
    <line x1="-65" y1="50" x2="-25" y2="-65" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="-50" y1="55" x2="-10" y2="-60" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="-60" y1="35" x2="-45" y2="40" stroke="#fef08a" stroke-width="2" />
    <line x1="-50" y1="5" x2="-35" y2="10" stroke="#fef08a" stroke-width="2" />
    <line x1="-40" y1="-25" x2="-25" y2="-20" stroke="#fef08a" stroke-width="2" />
    <line x1="-30" y1="-55" x2="-15" y2="-50" stroke="#fef08a" stroke-width="2" />

    <!-- Luminous Sea Serpent / Snake -->
    <path d="M65,-60 Q20,-40 50,0 Q80,40 10,60" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" />
    <!-- Snake Head -->
    <circle cx="68" cy="-62" r="7" fill="#6ee7b7" />
    <circle cx="70" cy="-64" r="2" fill="#064e3b" />

    <!-- Glowing game pawn / pearl -->
    <circle cx="-5" cy="45" r="9" fill="#f0fdf4" stroke="#2dd4bf" stroke-width="2" />
  </g>
  <text x="400" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#f0fdf4" text-anchor="middle" letter-spacing="3">SNAKES AND LADDERS</text>
  <text x="400" y="450" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#2dd4bf" text-anchor="middle" letter-spacing="4">THE MYTHIC BOARD ASCENT</text>
</svg>
