<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="munbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="munglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0" />
    </radialGradient>
    <filter id="munblur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#munbg)" />
  <circle cx="400" cy="220" r="185" fill="url(#munglow)" filter="url(#munblur)" />

  <!-- Global UN Emblem & Diplomatic Assembly Chamber -->
  <g transform="translate(400, 215)">
    <!-- Outer Olive Laurel Wreath -->
    <path d="M-80,20 C-95,-20 -80,-65 -40,-85 C-55,-60 -50,-20 -40,15 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M80,20 C95,-20 80,-65 40,-85 C55,-60 50,-20 40,15 Z" fill="#38bdf8" opacity="0.8" />
    
    <!-- Central Globe Circle -->
    <circle cx="0" cy="-25" r="58" fill="#0284c7" fill-opacity="0.5" stroke="#e0f2fe" stroke-width="2.5" />
    <!-- Latitude & Longitude Lines -->
    <ellipse cx="0" cy="-25" rx="58" ry="24" fill="none" stroke="#7dd3fc" stroke-width="1.5" />
    <ellipse cx="0" cy="-25" rx="30" ry="58" fill="none" stroke="#7dd3fc" stroke-width="1.5" />
    <line x1="-58" y1="-25" x2="58" y2="-25" stroke="#7dd3fc" stroke-width="1.5" />
    <line x1="0" y1="-83" x2="0" y2="33" stroke="#7dd3fc" stroke-width="1.5" />
    
    <!-- Diplomatic Gavel & Assembly Podium Base -->
    <rect x="-65" y="45" width="130" height="24" rx="4" fill="#075985" stroke="#38bdf8" stroke-width="2" />
    <rect x="-25" y="30" width="50" height="16" rx="3" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5" />
  </g>
  <text x="400" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#f0f9ff" text-anchor="middle" letter-spacing="3">MODEL UNITED NATIONS</text>
  <text x="400" y="450" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#7dd3fc" text-anchor="middle" letter-spacing="4">GLOBAL DIPLOMACY & DEBATE • NITRRMUN.IN</text>
</svg>
