<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sfbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="sfglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0" />
    </radialGradient>
    <filter id="sfblur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#sfbg)" />
  <circle cx="400" cy="220" r="190" fill="url(#sfglow)" filter="url(#sfblur)" />

  <!-- Submerged Anvil & Glowing Story Crystals -->
  <g transform="translate(400, 215)">
    <!-- Molten Anvil -->
    <path d="M-80,40 L80,40 L65,70 L-65,70 Z" fill="#44403c" stroke="#f59e0b" stroke-width="2" />
    <path d="M-55,0 L55,0 L40,40 L-40,40 Z" fill="#292524" stroke="#fbbf24" stroke-width="2" />
    <rect x="-90" y="-20" width="180" height="24" rx="4" fill="#57534e" stroke="#fbbf24" stroke-width="2" />
    
    <!-- Glowing Hammer strike -->
    <path d="M10,-40 L60,-90 L80,-70 L30,-20 Z" fill="#ea580c" stroke="#fbbf24" stroke-width="2" />
    <line x1="20" y1="-30" x2="-40" y2="30" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    
    <!-- Sparks & Story Crystals -->
    <polygon points="0,-60 15,-30 0,0 -15,-30" fill="#fef08a" opacity="0.9" />
    <polygon points="-50,-50 -40,-35 -50,-20 -60,-35" fill="#fed7aa" opacity="0.8" />
    <polygon points="55,-45 65,-30 55,-15 45,-30" fill="#fef08a" opacity="0.8" />
  </g>
  <text x="400" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#fef3c7" text-anchor="middle" letter-spacing="3">STORYFORGE CHAMPIONSHIPS</text>
  <text x="400" y="450" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="middle" letter-spacing="4">CRAFTING WORDS UNDER PRESSURE</text>
</svg>
